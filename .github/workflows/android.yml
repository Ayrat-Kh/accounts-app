name: android

# The Android app: Kotlin lint and unit tests, then the full build, which
# compiles the C++ core and its dependencies with the NDK for arm64 and x86_64.
# A v* tag also builds a signed release APK and attaches it to a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["android/**", "core/**", ".github/workflows/android.yml", ".github/actions/**"]
  pull_request:
    paths: ["android/**", "core/**", ".github/workflows/android.yml", ".github/actions/**"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: "28.2.13676358"
  CMAKE_VERSION: "3.31.6"

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: {distribution: temurin, java-version: "21"}

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: NDK and CMake
        run: |
          sdkmanager "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: ./.github/actions/setup-vcpkg
        with: {cache-key: android}

      - name: Lint and unit tests
        run: ./gradlew ktlintCheck detekt testDebugUnitTest

      - name: Build debug APK (with the native core)
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accounts-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # create the GitHub Release
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: {distribution: temurin, java-version: "21"}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: NDK and CMake
        run: |
          sdkmanager "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: ./.github/actions/setup-vcpkg
        with: {cache-key: android}

      # Secrets of the "release" environment: ANDROID_KEYSTORE_BASE64 and the
      # three passwords/alias that app/build.gradle.kts reads.
      - name: Signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          export ANDROID_KEYSTORE_PATH="${RUNNER_TEMP}/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          ./gradlew :app:assembleRelease -Paccounts.googleServerClientId="$GOOGLE_SERVER_CLIENT_ID"
          rm -f "$ANDROID_KEYSTORE_PATH"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" app/build/outputs/apk/release/*.apk --generate-notes
