apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: security-headers, namespace: app-accounts}
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: no-referrer
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: auth-ratelimit, namespace: app-accounts}
spec:
  rateLimit: {average: 10, period: 1m, burst: 20}
