org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# OAuth "Web application" client id whose ID tokens accounts-api accepts
# (deploy/config.env GOOGLE_CLIENT_IDS). Override with -Paccounts.googleServerClientId=...
accounts.googleServerClientId=REPLACE_ME.apps.googleusercontent.com
accounts.apiBaseUrl=https://accounts.fernfall.cloud
